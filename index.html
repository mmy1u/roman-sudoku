<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
 <div id="authScreen">
    <h1 class="auth-title">Roman Sudoku</h1>

    <div id="authButtons">
        <div id="showSignupBtn" class="auth-btn">إنشاء حساب</div>
        <div id="showLoginBtn" class="auth-btn">تسجيل الدخول</div>
        <div id="googleLoginBtn" class="auth-btn google">تسجيل الدخول بواسطة Google</div>
        <div id="guestBtn" class="auth-btn guest">اللعب كضيف</div>
    </div>

    <div id="signupForm" class="auth-form">
        <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" class="auth-input">
        <input type="password" id="signupPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" class="auth-input">
        <div id="signupSubmitBtn" class="auth-btn">إنشاء الحساب</div>
        <div id="signupBackBtn" class="auth-btn guest">رجوع</div>
        <p id="signupError" class="auth-error"></p>
    </div>

    <div id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="auth-input">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" class="auth-input">
        <div id="loginSubmitBtn" class="auth-btn">تسجيل الدخول</div>
        <div id="loginBackBtn" class="auth-btn guest">رجوع</div>
        <p id="loginError" class="auth-error"></p>
    </div>
</div>

    <h1>Roman Sudoku</h1>
    <div id="soundBtn">🔊</div>
    <div id="themeBtn">🌙</div>
  <div id="logoutBtn">🚪</div>
    <div id="statsBtn">📊 إحصائياتي</div>
    <div id="statsModal">
        <div id="statsContent">
            <h2>إحصائياتي</h2>
            <p id="totalSolved"></p>
            <p id="bestEasy"></p>
            <p id="bestMedium"></p>
            <p id="bestHard"></p>
            <p id="bestExpert"></p>
            <div id="achievementsList"></div>
            <div id="closeStatsBtn">إغلاق ✕</div>
        </div>
    </div>
    <div id="dailyBtn">📅 تحدي اليوم</div>
    <div id="difficultyButtons">
        <div class="diff-btn" data-level="easy">سهل</div>
        <div class="diff-btn" data-level="medium">متوسط</div>
        <div class="diff-btn" data-level="hard">صعب</div>
        <div class="diff-btn" data-level="expert">خبير</div>
    </div>
    <div id="stats">
        <span id="timer">⏱️ 00:00</span>
        <span id="errorCount">❌ 0</span>
        <span id="bestTime">🏆 --:--</span>
    </div>
    <div id="board"></div>
    <div id="numberPad"></div>
    <div id="newGameBtn">لغز جديد 🔄</div>
    <div id="actionButtons">
        <div id="undoBtn">↩️ تراجع</div>
        <div id="restartBtn">🔁 إعادة</div>
        <div id="checkBtn">✓ تحقق</div>
        <div id="hintBtn">💡 تلميح</div>
        <div id="notesBtn">✏️ ملاحظات</div>
        <div id="solveBtn">🔓 عرض الحل</div>
    </div>
    <div id="winMessage"></div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvXa2ZggLmdT6PDTzwxAETOGfA-r08hC8",
        authDomain: "roman-sudoku-32232.firebaseapp.com",
        projectId: "roman-sudoku-32232",
        storageBucket: "roman-sudoku-32232.firebasestorage.app",
        messagingSenderId: "754569598290",
        appId: "1:754569598290:web:74829f667670a6194ad68b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    window.firebaseAuth = auth;

    window.firebaseSignInAnonymously = function() {
        return signInAnonymously(auth);
    };

    window.firebaseSignInWithGoogle = function() {
        return signInWithPopup(auth, googleProvider);
    };

    window.firebaseSignUp = function(email, password) {
        return createUserWithEmailAndPassword(auth, email, password);
    };

    window.firebaseSignIn = function(email, password) {
        return signInWithEmailAndPassword(auth, email, password);
    };

    window.firebaseSignOut = function() {
        return signOut(auth);
    };

    onAuthStateChanged(auth, function(user) {
        if (user) {
            document.getElementById("authScreen").style.display = "none";
            console.log("Logged in as:", user.uid, "Anonymous:", user.isAnonymous);
        } else {
            document.getElementById("authScreen").style.display = "flex";
        }
    });
      </script>

    <script src="js/sudoku-logic.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
